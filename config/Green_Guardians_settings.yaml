project:
  name: Green Guardians
  hazards: [fire, smoke]
  configured_pipeline: "Mission Controller -> alert/log -> dashboard"

document_status:
  status: person_3_working_draft
  owner: person_3
  purpose: "Configure only Person 3's backend work and Person 4's dashboard work."

team_ownership:
  person_3: "Mission Controller — states, decisions, alerts, logs, mock integration, and application orchestration"
  person_4: "Streamlit — dashboard and visualization"

communication:
  architecture: "single Python application"
  transport: "in-process Python calls/queues; no HTTP API required for the first prototype"
  data_format: "JSON-compatible Python objects"
  validation: "Pydantic models or dataclasses"
  timestamp_format: "ISO-8601 UTC"
  id_format: "unique strings; UUID recommended"

mission_controller:
  owner: person_3
  initial_state: IDLE
  states:
    IDLE: "Mission is waiting to start."
    TAKEOFF: "A takeoff request was issued; backend is waiting for readiness."
    PATROL: "Normal monitoring is active."
    HAZARD_DETECTED: "A candidate detection was accepted for processing."
    INVESTIGATING: "The active candidate is being checked with new observations."
    CONFIRMED: "The investigation satisfied the backend confirmation rule."
    REJECTED: "The investigation did not satisfy the confirmation rule."
    RETURN_HOME: "A return-home request was issued."
    LANDING: "A landing request was issued."
    LANDED: "Mission movement is complete."
    ERROR: "An error prevents normal mission operation."
  normal_flow: "IDLE -> TAKEOFF -> PATROL -> HAZARD_DETECTED -> INVESTIGATING -> CONFIRMED|REJECTED -> PATROL -> RETURN_HOME -> LANDING -> LANDED"
  rules:
    - "Only one investigation may be active at a time."
    - "CONFIRMED creates exactly one alert for that investigation."
    - "REJECTED creates no confirmed alert."
    - "After CONFIRMED or REJECTED, return the backend to PATROL."
    - "Invalid input is logged and does not crash the controller."

# Internal mock shapes used only to develop and test Person 3's backend.
backend_contracts:
  status: person_3_internal_mocks

  mock_detection_input:
    owner: person_3
    required_fields:
      detection_id: string
      timestamp: string
      hazard: "fire | smoke"
      confidence: "float 0.0..1.0"
      source: "patrol | investigation"
    optional_fields:
      frame_id: "string or null"
      evidence_image_path: "string or null"
    example:
      detection_id: det-mock-001
      timestamp: "2026-08-15T10:00:00Z"
      hazard: fire
      confidence: 0.91
      source: patrol
      frame_id: frame-mock-001
      evidence_image_path: null

  investigation_result:
    owner: person_3
    required_fields:
      investigation_id: string
      detection_id: string
      started_at: "string; ISO-8601 UTC"
      completed_at: "string; ISO-8601 UTC"
      hazard: "fire | smoke"
      result: "CONFIRMED | REJECTED"
      observations_checked: integer
      positive_observations: integer
    optional_fields:
      representative_confidence: "float 0.0..1.0 or null"
      evidence_image_path: "string or null"
    example:
      investigation_id: inv-001
      detection_id: det-mock-001
      started_at: "2026-08-15T10:00:01Z"
      completed_at: "2026-08-15T10:00:06Z"
      hazard: fire
      result: CONFIRMED
      observations_checked: 5
      positive_observations: 3
      representative_confidence: 0.89
      evidence_image_path: null

  alert_output:
    producer: person_3
    consumer: person_4
    required_fields:
      alert_id: string
      investigation_id: string
      detection_id: string
      timestamp: string
      hazard: "fire | smoke"
      status: CONFIRMED
      confidence: "float 0.0..1.0"
    optional_fields:
      evidence_image_path: "string or null"
    example:
      alert_id: alert-001
      investigation_id: inv-001
      detection_id: det-mock-001
      timestamp: "2026-08-15T10:00:06Z"
      hazard: fire
      status: CONFIRMED
      confidence: 0.89
      evidence_image_path: null

  dashboard_status_output:
    status: provisional_for_person_4_review
    producer: person_3
    consumer: person_4
    required_fields:
      timestamp: "string; ISO-8601 UTC"
      mission_state: "IDLE | TAKEOFF | PATROL | HAZARD_DETECTED | INVESTIGATING | CONFIRMED | REJECTED | RETURN_HOME | LANDING | LANDED | ERROR"
      backend_available: boolean
      live_input_available: boolean
      investigation_status: "IDLE | ACTIVE | CONFIRMED | REJECTED"
      latest_detection: "mock_detection_input object or null"
      latest_alert: "alert_output object or null"
      confirmed_alert_count: integer
    optional_fields:
      system_message: "string or null"
    example:
      timestamp: "2026-08-15T10:00:06Z"
      mission_state: CONFIRMED
      backend_available: true
      live_input_available: false
      investigation_status: CONFIRMED
      latest_detection:
        detection_id: det-mock-001
        timestamp: "2026-08-15T10:00:00Z"
        hazard: fire
        confidence: 0.91
        source: patrol
        frame_id: frame-mock-001
        evidence_image_path: null
      latest_alert:
        alert_id: alert-001
        investigation_id: inv-001
        detection_id: det-mock-001
        timestamp: "2026-08-15T10:00:06Z"
        hazard: fire
        status: CONFIRMED
        confidence: 0.89
        evidence_image_path: null
      confirmed_alert_count: 1
      system_message: "Fire investigation confirmed."

  log_event:
    owner: person_3
    required_fields:
      event_id: string
      timestamp: "string; ISO-8601 UTC"
      event_type: "STATE_CHANGE | INPUT_ACCEPTED | INPUT_REJECTED | INVESTIGATION_RESULT | ALERT_CREATED | ERROR"
      message: string
      mission_state: "IDLE | TAKEOFF | PATROL | HAZARD_DETECTED | INVESTIGATING | CONFIRMED | REJECTED | RETURN_HOME | LANDING | LANDED | ERROR"
    optional_fields:
      detection_id: "string or null"
      investigation_id: "string or null"
      alert_id: "string or null"
      details: "JSON-compatible object or null"
    example:
      event_id: event-001
      timestamp: "2026-08-15T10:00:06Z"
      event_type: ALERT_CREATED
      message: "Confirmed fire alert created."
      mission_state: CONFIRMED
      detection_id: det-mock-001
      investigation_id: inv-001
      alert_id: alert-001
      details:
        confidence: 0.89

backend_policy:
  owner: person_3
  investigation:
    observation_window: 5
    required_positive_observations: 3
    same_hazard_required: true
    note: "Person 3's mock scenarios supply whether each observation is positive."
  alerting:
    create_on_state: CONFIRMED
    status_value: CONFIRMED
    duplicate_rule: "Create at most one alert per investigation_id."
  failure_handling:
    malformed_input: "Reject the item, record an error log, and keep the application running."
    unavailable_input: "Report that live input is unavailable and continue with Person 3's mock data."
    timeout_value: "Not configured in this Person 3/4-only file."

logging:
  owner: person_3
  format: JSONL
  output_path: "results/mission_log.jsonl"
  event_format: backend_contracts.log_event
  record:
    - state_changes
    - accepted_and_rejected_inputs
    - investigation_results
    - alerts
    - errors
  required_log_fields: [timestamp, event_type, message]

dashboard:
  owner: person_4
  backend_source: "Person 3 provides JSON-compatible snapshots/events."
  status_format: backend_contracts.dashboard_status_output
  refresh_seconds: 1
  must_show:
    - mission_state
    - module_availability
    - latest_fire_or_smoke_detection
    - confidence
    - evidence_image_when_available
    - investigation_status
    - confirmed_alert_history

mock_development:
  owner: person_3
  enabled: true
  sample_data_folder: sample_data
  scenarios:
    - no_hazard_continue_patrol
    - fire_candidate_confirmed
    - smoke_candidate_rejected
    - malformed_detection_rejected_safely
    - unavailable_live_input_reported

files_and_folders:
  backend: "Person 3 controller, state machine, alert manager, and logger"
  shared: "Provisional Pydantic models/dataclasses used by Person 3 mocks"
  sample_data: "Person 3-owned mock inputs for isolated backend development"
  results: "Generated logs and evidence references"
  tests: "Person 3 unit, contract, and mock integration tests"
  dashboard: "Person 4 Streamlit code"
  main_py: "Person 3-led application entry point"

person_3_start_checklist:
  - "Create Pydantic models or dataclasses for the internal mock contracts."
  - "Implement the mission state machine."
  - "Implement one-alert-per-investigation deduplication."
  - "Implement JSONL logging."
  - "Create Person 3-owned mock detection inputs."
  - "Expose backend snapshots/events for Person 4's dashboard."
  - "Write unit and mock workflow tests."
