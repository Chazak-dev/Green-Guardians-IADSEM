project:
  name: Green Guardians
  hazards: [fire, smoke]
  configured_pipeline: "Mission Controller -> alert/log -> dashboard"

document_status:
  status: person_3_working_draft
  owner: person_3

team_ownership:
  person_1: "AI/CV — fire/smoke YOLO detection and re-check"
  person_2: "Webots — camera, drone status, patrol, investigation movement"
  person_3: "Mission Controller — states, decisions, alerts, logs, mock integration, and application orchestration"
  person_4: "Streamlit — dashboard and visualization"

communication:
  architecture: "single Python application"
  transport: "in-process Python calls/queues; no HTTP API required for the first prototype"
  data_format: "JSON-compatible Python objects"
  validation: "Pydantic models or dataclasses"
  timestamp_format: "ISO-8601 UTC"
  id_format: "unique strings; UUID recommended"

# -----------------------------------------------------------------------------
# CROSS-MODULE CONTRACTS AND POLICY
# Restored from the original team-wide config: ai/ and drone/ depend on
# these sections (ai/model_config.py reads `ai:` directly), so they must
# stay even though this file is otherwise Person 3/4-focused.
# -----------------------------------------------------------------------------
contracts:
  camera_frame_metadata:
    producer: person_2
    consumers: [person_1, person_3]
    fields:
      frame_id: "string; required; unique"
      timestamp: "string; required; ISO-8601 UTC"
      image_width: "integer; required"
      image_height: "integer; required"
      drone_position: "object {x,y,z}; required; Webots world-frame metres from the GPS device, z positive up (see drone: section below)"
    example:
      frame_id: "frame-0042"
      timestamp: "2026-08-06T09:30:00Z"
      image_width: 640
      image_height: 480
      drone_position: {x: -9.0, y: -3.5, z: 12.0}

  detection_event:
    producer: person_1
    consumers: [person_3]
    displayed_by: person_4
    fields:
      detection_id: "string; required; unique"
      frame_id: "string; required"
      timestamp: "string; required; copied from source frame"
      hazard: "enum: fire | smoke"
      confidence: "float 0.0..1.0"
      bbox: "array of 4 integers: xyxy pixels"
      image_width: "integer; required"
      image_height: "integer; required"
      image_path: "string or null; annotated evidence image"
      source: "enum: patrol | investigation"
    example:
      detection_id: "det-001"
      frame_id: "frame-0042"
      timestamp: "2026-08-06T09:30:00Z"
      hazard: fire
      confidence: 0.93
      bbox: [150, 70, 420, 360]
      image_width: 640
      image_height: 480
      image_path: "results/frame-0042.jpg"
      source: patrol

  drone_status:
    producer: person_2
    consumers: [person_3]
    displayed_by: person_4
    fields:
      timestamp: "string; required"
      position: "object {x,y,z}; Webots world-frame metres from the GPS device, z positive up"
      altitude_m: "float; positive height; equals position.z directly (Webots z is already positive up, unlike AirSim's NED convention this file originally assumed)"
      mission_state: "enum: IDLE | TAKEOFF | PATROL | HAZARD_DETECTED | INVESTIGATING | CONFIRMED | REJECTED | RETURN_HOME | LANDING | LANDED | ERROR; NOT reported by the drone (drone_controller.py has no concept of it) - filled in by the backend's own current MissionState when this status is built"
      current_waypoint_index: "integer or null; only meaningful while drone/mission.py's PatrolMission is running"
    example:
      timestamp: "2026-08-06T09:30:01Z"
      position: {x: -9.0, y: -3.5, z: 12.0}
      altitude_m: 12.0
      mission_state: PATROL
      current_waypoint_index: 2

  navigation_command:
    producer: person_3
    consumer: person_2
    fields:
      command_id: "string; required; unique"
      timestamp: "string; required"
      command: "enum: INVESTIGATE | RESUME_PATROL | RETURN_HOME | LAND"
      detection_id: "string or null"
      target_hint: "object or null; bbox + image dimensions, NOT a claimed GPS location"
    example:
      command_id: "cmd-001"
      timestamp: "2026-08-06T09:30:02Z"
      command: INVESTIGATE
      detection_id: "det-001"
      target_hint:
        bbox: [150, 70, 420, 360]
        image_width: 640
        image_height: 480

  alert_event:
    producer: person_3
    consumer: person_4
    fields:
      alert_id: "string; required; unique"
      detection_id: "string; required; candidate that started investigation"
      timestamp: "string; required; confirmation time"
      hazard: "enum: fire | smoke"
      status: "enum: CONFIRMED;"
      confidence: "float; representative confirmation confidence"
      evidence_image_path: "string or null"
      observed_position: "object {x,y,z}; Webots world-frame position of drone when evidence was captured, z positive up; NOT exact hazard GPS"
    example:
      alert_id: "alert-001"
      detection_id: "det-001"
      timestamp: "2026-08-06T09:30:07Z"
      hazard: fire
      status: CONFIRMED
      confidence: 0.88
      evidence_image_path: "results/frame-0047.jpg"
      observed_position: {x: -13.5, y: -5.7, z: 12.0}

shared_policy:
  candidate_trigger:
    rule: "During PATROL, fire/smoke confidence >= 0.60 creates a candidate and triggers investigation."
    threshold: 0.60
  simultaneous_detections:
    rule: "If several fire/smoke candidates occur in one frame, compare their bounding-box positions. Candidates that are not far apart are treated as one incident/location, and the highest-confidence candidate represents that incident. Candidates that are far apart are treated as separate incidents; investigate the highest-confidence incident first and log the others for later investigation."
    distance_method: "Use the agreed 3x3 image-region rule: centers in the same region are not far apart; centers in clearly separated regions are far apart; centers in neighboring regions are grouped only when their bounding boxes overlap. Fire and smoke may represent the same incident."
  while_investigating:
    rule: "Do not start a second investigation concurrently. Continue collecting evidence for the active candidate."
  confirmation:
    fresh_frames_to_check: 5
    required_positive_frames: 3
    confidence_threshold: 0.65
    same_hazard_required: true
    timeout_seconds: 15
    rule: "CONFIRMED when the original hazard class appears in >=3 of 5 fresh investigation frames at confidence >=0.65 before timeout; otherwise REJECTED."
  after_confirmed: "Create one alert, log it, command RESUME_PATROL."
  after_rejected: "Log rejection, create no confirmed alert, command RESUME_PATROL."
  post_alert_suppression_radius_m: 5
  duplicate_rule: "After a confirmed alert, suppress new PATROL-phase fire/smoke candidates within post_alert_suppression_radius_m (5m, horizontal x,y distance only - altitude is not part of the comparison) of that alert's observed_position: do not start another investigation or create another alert for a candidate in that radius, while the drone continues patrolling normally. Candidates outside the radius are processed under the normal policy (shared_policy.candidate_trigger). This is position-based, not time-based: drone/drone_controller.py's flight control is a per-tick PID stabilization loop with no constant commanded speed (see drone.flight_control), so travel time between waypoints is not a reliable proxy for 'still near the same fire' - physical distance is, regardless of how long it took to get there or how sharp the turns were. 5m was chosen to sit between the ~2m investigation approach distance (drone.investigation_maneuver.investigation_approach_m) and the real ~5-8m gap between adjacent patrol waypoints (drone.patrol_route), so it should absorb investigation-position noise around one fire without spilling into a neighboring waypoint's genuinely different location. Tune here if either of those numbers changes."

# -----------------------------------------------------------------------------
# IMPLEMENTATION BASELINES - owners can tune after measurement
# -----------------------------------------------------------------------------
ai:
  owner: person_1
  model_path: "models/fire_smoke.pt"
  classes: [fire, smoke]
  imgsz: 640
  iou_threshold: 0.45
  inference_fps_target: 2
  device: auto
  # AI-module noise floor passed to YOLO's own conf= at inference time - NOT
  # the same thing as shared_policy.candidate_trigger.threshold (0.60), which
  # is Person 3's backend decision for turning a detection into an
  # investigation candidate. This module just reports what it sees above
  # this floor; it does not implement the 0.60 business rule.
  confidence_threshold: 0.25
  tuning_rule: "P1 may tune imgsz/IoU/FPS/model after evaluation; update this file and tell P2/P3 if latency or frame requirements change."

camera:
  owners: [person_1, person_2]
  width: 640
  height: 480
  color_format: BGR
  note: "OpenCV uses BGR. P2's adapter must deliver this format to P1. Camera resolution is NOT the same setting as YOLO imgsz."

drone:
  owner: person_2
  status: "Reflects drone/drone_controller.py and drone/mission.py as implemented, not the original AirSim design."
  simulator: "Webots R2025a, DJI Mavic 2 PRO, extern controller — see drone/webots_world/green_guardians_patrol.wbt"
  coordinate_system: "Webots world frame, metres, read from the GPS device: z is altitude and is positive up. NOT AirSim NED — the project switched simulators from AirSim to Webots after this file's coordinates were first written (see DroneController.get_position()'s docstring in drone_controller.py)."
  patrol_altitude_m: 12.0  # CRUISE_ALTITUDE in drone/mission.py; clears the tallest tree (~9.1m) by 3m
  flight_control: "A per-tick PID-style stabilization loop (DroneController._stabilize_step), not a constant commanded speed. There is no patrol_speed_mps/investigation_speed_mps knob in code; the drone converges on each target within TARGET_PRECISION_M (0.5m) horizontally and ALTITUDE_PRECISION_M (0.3m) vertically."
  patrol_route:
    status: implemented
    source: "drone/mission.py PATROL_ROUTE - absolute Webots-world waypoints tied to green_guardians_patrol.wbt, not relative offsets from a home point"
    cruise_altitude_m: 12.0
    waypoints:
      - {name: fire_observation, x: -4, y: -1.5, z: 12.0}
      - {name: forest_edge, x: -9, y: -3.5, z: 12.0}
      - {name: patrol_west, x: -15.9, y: -7.0, z: 12.0}
      - {name: patrol_south, x: -11, y: -8.5, z: 12.0}
      - {name: exit_forest, x: -7, y: -4, z: 12.0}
      - {name: return_base, x: -1, y: -0.5, z: 12.0}
  investigation_maneuver:
    status: not_yet_implemented
    note: "drone/ currently only implements connect/arm/takeoff/move_to/land plus the fixed patrol route above. No investigate()/approach behavior exists yet; investigation_approach_m is a target for that future work, not current behavior."
    investigation_approach_m: 2
  tuning_rule: "P2 must test scene safety; altitude/waypoints/approach may be tuned without a team vote, but changes must stay here and P1 must be told if camera view changes materially."

mission_controller:
  owner: person_3
  initial_state: IDLE
  states:
    IDLE: "Mission is waiting to start."
    TAKEOFF: "A takeoff request was issued; backend is waiting for readiness."
    PATROL: "Normal monitoring is active."
    HAZARD_DETECTED: "A candidate detection was accepted for processing."
    INVESTIGATING: "The active candidate is being checked with new observations."
    CONFIRMED: "The investigation satisfied the backend confirmation rule."
    REJECTED: "The investigation did not satisfy the confirmation rule."
    RETURN_HOME: "A return-home request was issued."
    LANDING: "A landing request was issued."
    LANDED: "Mission movement is complete."
    ERROR: "An error prevents normal mission operation."
  normal_flow: "IDLE -> TAKEOFF -> PATROL -> HAZARD_DETECTED -> INVESTIGATING -> CONFIRMED|REJECTED -> PATROL -> RETURN_HOME -> LANDING -> LANDED"
  rules:
    - "Only one investigation may be active at a time."
    - "CONFIRMED creates exactly one alert for that investigation."
    - "REJECTED creates no confirmed alert."
    - "After CONFIRMED or REJECTED, return the backend to PATROL."
    - "Invalid input is logged and does not crash the controller."

# Internal mock shapes used only to develop and test Person 3's backend.
backend_contracts:
  status: person_3_internal_mocks

  mock_detection_input:
    owner: person_3
    required_fields:
      detection_id: string
      timestamp: string
      hazard: "fire | smoke"
      confidence: "float 0.0..1.0"
      source: "patrol | investigation"
      position: "object {x,y,z}; required; Webots world-frame metres, z positive up (see drone: section)"
      bbox: "array of 4 integers: xyxy pixels; required; matches ai/detector.py's YOLO output"
      image_width: "integer; required"
      image_height: "integer; required"
    optional_fields:
      frame_id: "string or null"
      image_path: "string or null; annotated evidence image (renamed from evidence_image_path to match contracts.detection_event / ai/detector.py's actual output key)"
    example:
      detection_id: det-mock-001
      timestamp: "2026-08-15T10:00:00Z"
      hazard: fire
      confidence: 0.91
      source: patrol
      position: {x: -9.0, y: -3.5, z: 12.0}
      bbox: [150, 70, 420, 360]
      image_width: 640
      image_height: 480
      frame_id: frame-mock-001
      image_path: null

  investigation_result:
    owner: person_3
    required_fields:
      investigation_id: string
      detection_id: string
      started_at: "string; ISO-8601 UTC"
      completed_at: "string; ISO-8601 UTC"
      hazard: "fire | smoke"
      result: "CONFIRMED | REJECTED"
      observations_checked: integer
      positive_observations: integer
    optional_fields:
      representative_confidence: "float 0.0..1.0 or null"
      evidence_image_path: "string or null"
    example:
      investigation_id: inv-001
      detection_id: det-mock-001
      started_at: "2026-08-15T10:00:01Z"
      completed_at: "2026-08-15T10:00:06Z"
      hazard: fire
      result: CONFIRMED
      observations_checked: 5
      positive_observations: 3
      representative_confidence: 0.89
      evidence_image_path: null

  alert_output:
    producer: person_3
    consumer: person_4
    required_fields:
      alert_id: string
      investigation_id: string
      detection_id: string
      timestamp: string
      hazard: "fire | smoke"
      status: CONFIRMED
      confidence: "float 0.0..1.0"
      observed_position: "object {x,y,z}; required; Webots world-frame metres, z positive up; NOT exact hazard GPS"
    optional_fields:
      evidence_image_path: "string or null"
    example:
      alert_id: alert-001
      investigation_id: inv-001
      detection_id: det-mock-001
      timestamp: "2026-08-15T10:00:06Z"
      hazard: fire
      status: CONFIRMED
      confidence: 0.89
      observed_position: {x: -13.5, y: -5.7, z: 12.0}
      evidence_image_path: null

  dashboard_status_output:
    status: provisional_for_person_4_review
    producer: person_3
    consumer: person_4
    required_fields:
      timestamp: "string; ISO-8601 UTC"
      mission_state: "IDLE | TAKEOFF | PATROL | HAZARD_DETECTED | INVESTIGATING | CONFIRMED | REJECTED | RETURN_HOME | LANDING | LANDED | ERROR"
      drone_position: "object {x,y,z}; required; Webots world-frame metres, z positive up; the drone's CURRENT position, independent of any detection/alert"
      altitude_m: "float; required; equals drone_position.z (Webots z is already positive up)"
      backend_available: boolean
      live_input_available: boolean
      investigation_status: "IDLE | ACTIVE | CONFIRMED | REJECTED"
      latest_detection: "mock_detection_input object or null"
      latest_alert: "alert_output object or null"
      confirmed_alert_count: integer
    optional_fields:
      evidence_image_path: "string or null; most relevant image to display - latest_alert.evidence_image_path if a confirmed alert exists, otherwise latest_detection.image_path"
      system_message: "string or null"
    example:
      timestamp: "2026-08-15T10:00:06Z"
      mission_state: CONFIRMED
      drone_position: {x: -13.5, y: -5.7, z: 12.0}
      altitude_m: 12.0
      backend_available: true
      live_input_available: false
      investigation_status: CONFIRMED
      latest_detection:
        detection_id: det-mock-001
        timestamp: "2026-08-15T10:00:00Z"
        hazard: fire
        confidence: 0.91
        source: patrol
        position: {x: -9.0, y: -3.5, z: 12.0}
        bbox: [150, 70, 420, 360]
        image_width: 640
        image_height: 480
        frame_id: frame-mock-001
        image_path: null
      latest_alert:
        alert_id: alert-001
        investigation_id: inv-001
        detection_id: det-mock-001
        timestamp: "2026-08-15T10:00:06Z"
        hazard: fire
        status: CONFIRMED
        confidence: 0.89
        observed_position: {x: -13.5, y: -5.7, z: 12.0}
        evidence_image_path: null
      confirmed_alert_count: 1
      evidence_image_path: null
      system_message: "Fire investigation confirmed."

  log_event:
    owner: person_3
    required_fields:
      event_id: string
      timestamp: "string; ISO-8601 UTC"
      event_type: "STATE_CHANGE | INPUT_ACCEPTED | INPUT_REJECTED | INVESTIGATION_RESULT | ALERT_CREATED | ERROR"
      message: string
      mission_state: "IDLE | TAKEOFF | PATROL | HAZARD_DETECTED | INVESTIGATING | CONFIRMED | REJECTED | RETURN_HOME | LANDING | LANDED | ERROR"
    optional_fields:
      detection_id: "string or null"
      investigation_id: "string or null"
      alert_id: "string or null"
      details: "JSON-compatible object or null"
    example:
      event_id: event-001
      timestamp: "2026-08-15T10:00:06Z"
      event_type: ALERT_CREATED
      message: "Confirmed fire alert created."
      mission_state: CONFIRMED
      detection_id: det-mock-001
      investigation_id: inv-001
      alert_id: alert-001
      details:
        confidence: 0.89

backend_policy:
  owner: person_3
  investigation:
    observation_window: 5
    required_positive_observations: 3
    same_hazard_required: true
    note: "Person 3's mock scenarios supply whether each observation is positive."
  alerting:
    create_on_state: CONFIRMED
    status_value: CONFIRMED
    duplicate_rule: "Create at most one alert per investigation_id."
  failure_handling:
    malformed_input: "Reject the item, record an error log, and keep the application running."
    unavailable_input: "Report that live input is unavailable and continue with Person 3's mock data."
    timeout_value: "Not configured in this Person 3/4-only file."

logging:
  owner: person_3
  format: JSONL
  output_path: "results/mission_log.jsonl"
  event_format: backend_contracts.log_event
  record:
    - state_changes
    - accepted_and_rejected_inputs
    - investigation_results
    - alerts
    - errors
  required_log_fields: [timestamp, event_type, message]

dashboard:
  owner: person_4
  backend_source: "Person 3 provides JSON-compatible snapshots/events."
  status_format: backend_contracts.dashboard_status_output
  refresh_seconds: 1
  must_show:
    - mission_state
    - drone_position_and_altitude
    - module_availability
    - latest_fire_or_smoke_detection
    - confidence
    - evidence_image_when_available
    - investigation_status
    - confirmed_alert_history

mock_development:
  owner: person_3
  enabled: true
  sample_data_folder: sample_data
  scenarios:
    - no_hazard_continue_patrol
    - fire_candidate_confirmed
    - smoke_candidate_rejected
    - malformed_detection_rejected_safely
    - unavailable_live_input_reported

files_and_folders:
  backend: "Person 3 controller, state machine, alert manager, and logger"
  shared: "Provisional Pydantic models/dataclasses used by Person 3 mocks"
  sample_data: "Person 3-owned mock inputs for isolated backend development"
  results: "Generated logs and evidence references"
  tests: "Person 3 unit, contract, and mock integration tests"
  dashboard: "Person 4 Streamlit code"
  main_py: "Person 3-led application entry point"

person_3_start_checklist:
  - "Create Pydantic models or dataclasses for the internal mock contracts."
  - "Implement the mission state machine."
  - "Implement one-alert-per-investigation deduplication."
  - "Implement JSONL logging."
  - "Create Person 3-owned mock detection inputs."
  - "Expose backend snapshots/events for Person 4's dashboard."
  - "Write unit and mock workflow tests."
